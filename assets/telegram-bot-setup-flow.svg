<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Telegram bot setup flow for ESP32-CAM</title><desc id="desc">Create a bot, retrieve chat ID, configure secrets, connect ESP32-CAM securely, and test commands.</desc><rect width="1100" height="580" fill="#f8fafc"/><text x="550" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">Telegram Bot Setup — esp32RemoteCam</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="100" width="280" height="110" rx="15" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="210" y="135" font-size="20" font-weight="700" fill="#1e3a8a">1. Create bot</text><text x="210" y="164" font-size="16" fill="#1e40af">Telegram → @BotFather</text><text x="210" y="187" font-size="16" fill="#1e40af">Send /newbot</text>
<rect x="410" y="100" width="280" height="110" rx="15" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="550" y="135" font-size="20" font-weight="700" fill="#14532d">2. Get chat ID</text><text x="550" y="164" font-size="16" fill="#166534">Start your bot; retrieve</text><text x="550" y="187" font-size="16" fill="#166534">your numeric user ID</text>
<rect x="750" y="100" width="280" height="110" rx="15" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="890" y="135" font-size="20" font-weight="700" fill="#78350f">3. Configure secrets</text><text x="890" y="164" font-size="16" fill="#92400e">Local config.h only</text><text x="890" y="187" font-size="16" fill="#92400e">Never commit token</text>
<path d="M350 155H400M690 155H740" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>
<path d="M890 210V255H550V285" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="340" y="295" width="420" height="100" rx="15" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/><text x="550" y="330" font-size="20" font-weight="700" fill="#312e81">4. ESP32-CAM connects out</text><text x="550" y="359" font-size="16" fill="#3730a3">Wi-Fi + HTTPS/TLS + valid clock</text><text x="550" y="381" font-size="15" fill="#3730a3">Allowlist authorized chat ID</text>
<path d="M550 395V435" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/><rect x="340" y="445" width="420" height="78" rx="15" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="550" y="475" font-size="20" font-weight="700" fill="#6b21a8">5. Test bot commands</text><text x="550" y="501" font-size="16" fill="#7e22ce">/start • /status • /ip • /photo</text>
<rect x="70" y="290" width="220" height="185" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="180" y="325" font-size="18" font-weight="700" fill="#991b1b">Security note</text><text x="180" y="355" font-size="15" fill="#7f1d1d">Never use</text><text x="180" y="378" font-size="15" fill="#7f1d1d">setInsecure().</text><text x="180" y="408" font-size="15" fill="#7f1d1d">Bot chat access</text><text x="180" y="431" font-size="15" fill="#7f1d1d">does not secure</text><text x="180" y="454" font-size="15" fill="#7f1d1d">the HTTP stream.</text>
<path d="M340 345H300" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/></g></svg>