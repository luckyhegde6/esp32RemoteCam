<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">ESP32-CAM fixed LAN IP setup flow</title><desc id="desc">Steps to select a stable local IP safely using a DHCP reservation or static configuration.</desc><rect width="1100" height="560" fill="#f8fafc"/><text x="550" y="48" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#0f172a">ESP32-CAM — Stable LAN IP Setup</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="360" y="90" width="380" height="72" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="550" y="120" font-size="19" font-weight="700" fill="#1e3a8a">1. Inspect router LAN settings</text><text x="550" y="143" font-size="15" fill="#1e40af">Gateway, subnet mask, DHCP pool</text>
<path d="M550 162V202" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="210" width="380" height="72" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="550" y="240" font-size="19" font-weight="700" fill="#14532d">2. Prefer DHCP reservation</text><text x="550" y="263" font-size="15" fill="#166534">Reserve an address for camera MAC</text>
<path d="M550 282V322" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="330" width="380" height="72" rx="14" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/><text x="550" y="360" font-size="19" font-weight="700" fill="#78350f">3. Or set firmware static IP</text><text x="550" y="383" font-size="15" fill="#92400e">IP + gateway + subnet + DNS</text>
<path d="M550 402V442" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="450" width="380" height="64" rx="14" fill="#e0e7ff" stroke="#818cf8" stroke-width="2"/><text x="550" y="477" font-size="19" font-weight="700" fill="#312e81">4. Reboot and test locally</text><text x="550" y="498" font-size="15" fill="#3730a3">Open http://CAMERA_IP/</text>
<rect x="55" y="210" width="250" height="192" rx="14" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="180" y="245" font-size="18" font-weight="700" fill="#991b1b">Avoid conflicts</text><text x="180" y="278" font-size="15" fill="#7f1d1d">Do not choose an IP</text><text x="180" y="301" font-size="15" fill="#7f1d1d">already in use. Keep</text><text x="180" y="324" font-size="15" fill="#7f1d1d">it on the router's</text><text x="180" y="347" font-size="15" fill="#7f1d1d">subnet. Never copy</text><text x="180" y="370" font-size="15" fill="#7f1d1d">example values blindly.</text>
<path d="M360 245H310" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/></g></svg>