<rect x="55" y="710" width="1090" height="72" rx="12" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="80" y="740" font-family="Arial,sans-serif" font-size="17" fill="#9a3412" font-weight="700">Important:</text><text x="185" y="740" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">GPIO0 is boot-mode sensitive; ground only while flashing. GPIO4 is the flash LED and also SD DATA1.</text><text x="80" y="765" font-family="Arial,sans-serif" font-size="15" fill="#7c2d12">*GPIO availability varies with board revision and PSRAM/SD use. This is a functional reference, not a mechanical scale drawing.</text>
